async function saveDraft(){if(recording)await stopRecording();const text=$('#ideaInput').value.trim();if(!text&&!draftAttachments.length){toast('先写点什么，或添加一段录音 / 图片');$('#ideaInput').focus();return}const attachments=[];for(const item of draftAttachments){if(item.type==='link'){attachments.push({type:'link',url:item.url,name:item.url});continue}try{await putBlob(item.id,item.blob);attachments.push({type:item.type,id:item.id,name:item.name||item.type,mime:item.blob.type})}catch{toast('部分附件保存失败，已保留文字内容')}}const x=saveNewIdea(text,draftKind,null,attachments);$('#ideaInput').value='';draftKind='随想';updateKind();clearDraftAttachments();$('#linkEntry').classList.add('hidden');toast('收好了。这一刻的想法已经留下 ✳');requestAnimationFrame(()=>{const el=document.querySelector(`[data-open="${CSS.escape(x.id)}"]`);if(el)el.animate([{transform:'scale(.97)',opacity:.35},{transform:'scale(1)',opacity:1}],{duration:350,easing:'ease-out'})})}

// Media is stored in the browser's IndexedDB, separate from text metadata.
let dbPromise;
function db(){if(!('indexedDB' in window))return Promise.reject(new Error('浏览器不支持 IndexedDB'));if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('mind-island-media-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
async function putBlob(id,blob){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction('files','readwrite'),r=tx.objectStore('files').put(blob,id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function getBlob(id){const d=await db();return new Promise((res,rej)=>{const r=d.transaction('files','readonly').objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function deleteBlob(id){try{const d=await db();const tx=d.transaction('files','readwrite');tx.objectStore('files').delete(id)}catch{}}
const fileLimit=12*1024*1024;
function addImageFiles(files){let accepted=0;for(const f of Array.from(files||[])){if(!f.type.startsWith('image/'))continue;if(f.size>fileLimit){toast('单张图片不能超过 12 MB（演示版限制）');continue}draftAttachments.push({type:'image',blob:f,id:uid(),name:f.name,preview:URL.createObjectURL(f)});accepted++}if(accepted)renderDraftAttachments()}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('当前浏览器不支持录音；可以使用文字或上传图片');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(stream);recording={rec,stream,started:Date.now()};recorderChunks=[];transcript='';rec.ondataavailable=e=>{if(e.data?.size)recorderChunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recorderChunks,{type:rec.mimeType||'audio/webm'});if(blob.size){draftAttachments.push({type:'audio',blob,id:uid(),name:`语音记录 ${Math.round((Date.now()-recordingStartTime)/1000)} 秒`});renderDraftAttachments()}if(transcript.trim())$('#ideaInput').value=($('#ideaInput').value.trim()+'\n'+transcript.trim()).trim();speech=null;recording=null;setRecordingUI(false);toast('录音已附上；保存念头后会保留在本机')};recordingStartTime=Date.now();rec.start(250);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{speech=new SR();speech.lang='zh-CN';speech.continuous=true;speech.interimResults=false;speech.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)transcript+=e.results[i][0].transcript+' '};speech.onerror=()=>{};speech.start()}catch{speech=null}}setRecordingUI(true);toast('正在录音，点击红色按钮结束。支持时自动转写中文')}catch{toast('麦克风访问失败，请检查浏览器权限')}}
let recordingStartTime=0;function setRecordingUI(on){const b=$('#recordButton');b.classList.toggle('recording',on);b.innerHTML=on?`${ico('stop')}<span class="tool-label">结束录音</span>`:`${ico('mic')}<span class="tool-label">说一段</span>`}
function stopRecording(){return new Promise(resolve=>{if(!recording){resolve();return}const r=recording.rec;r.addEventListener('stop',()=>resolve(),{once:true});try{speech?.stop()}catch{};if(r.state!=='inactive')r.stop();else resolve()})}

function simulateGuide(mode){const x=ideas.find(a=>a.id===currentId);if(!x)return;const subject=shorten((x.text||'这个想法').replace(/[\r\n]/g,' '),35);let prompt='';if(mode==='question')prompt=`如果把「${subject}」当作一个值得深入的问题：你真正想解决的困扰是什么？能否举出一个具体场景？`;else if(mode==='challenge')prompt=`换一种可能性看：「${subject}」也许并不是唯一的解释。有没有一个反例，能让你重新审视这个判断？`;else if(mode==='connect'){const related=getRelated(x);prompt=related.length?`你之前记录过「${shorten(related[0].text,45)}」。它与你现在的想法共享了一些主题。你觉得两者是相互支持，还是存在矛盾？`:`目前没有明显的主题关联。你想把它与生活、学习、创作还是其他经历连接起来？`;}else prompt=`如果想小规模验证「${subject}」，能否设计一个一周内、无需大投入的小尝试？你会观察什么结果？`;addAiMessage('guide',prompt);$('#aiSection')?.scrollIntoView({block:'nearest',behavior:'smooth'})}

async function exportData(){toast('正在整理本地记录和附件……');const rows=[];for(const x of ideas){const copy=structuredClone(x);for(const a of copy.attachments||[]){if(a.id){try{const blob=await getBlob(a.id);if(blob)a.data=await blobToDataURL(blob)}catch{}}}rows.push(copy)}const blob=new Blob([JSON.stringify({format:'mind-island-backup',version:1,exportedAt:new Date().toISOString(),ideas:rows},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='念岛-想法备份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已准备下载，建议妥善保存')}
async function importData(file){try{const raw=JSON.parse(await file.text());if(raw.format!=='mind-island-backup'||!Array.isArray(raw.ideas)||raw.ideas.length>20000)throw Error('文件格式不正确');let count=0;for(const src of raw.ideas){if(!src||typeof src.id!=='string'||typeof src.text!=='string'||typeof src.createdAt!=='string')continue;if(ideas.some(x=>x.id===src.id))continue;const attachments=[];for(const a of Array.isArray(src.attachments)?src.attachments:[]){if(a.type==='link'){if(safeURL(a.url))attachments.push({type:'link',url:a.url,name:a.name||a.url})}else if((a.type==='audio'||a.type==='image')&&typeof a.id==='string'&&typeof a.data==='string'&&a.data.startsWith('data:')){const b=await dataURLtoBlob(a.data);if(b.size<=fileLimit*2){await putBlob(a.id,b);attachments.push({type:a.type,id:a.id,name:String(a.name||a.type).slice(0,150),mime:b.type})}}}ideas.push({id:src.id,text:src.text.slice(0,500000),kind:String(src.kind||'随想'),createdAt:src.createdAt,updatedAt:src.updatedAt||src.createdAt,tags:Array.isArray(src.tags)?src.tags.filter(t=>typeof t==='string').slice(0,8):inferTags(src.text),favorite:!!src.favorite,parentId:typeof src.parentId==='string'?src.parentId:null,attachments,demo:!!src.demo});count++}persist();renderAll();closeModal();toast(`导入完成：新增 ${count} 条记录`)}catch(e){toast('导入失败：文件格式不正确或附件无法恢复')}}

function hash(s){let a=0;for(const c of s)a=(a*31+c.charCodeAt(0))>>>0;return a}
function visibleIdeas(){return graphFilter==='全部'?ideas:ideas.filter(x=>kindOf(x.kind)===graphFilter)}
function rebuildGraph(){const items=visibleIdeas();const all=ideas.length;$('#graphNum').textContent=graphFilter==='全部'?`· ${all} 条记录`:`· ${items.length} / ${all} 条记录`;const old=new Map(nodes.map(x=>[x.id,x]));nodes=items.map((x,i)=>{const h=hash(x.id),angle=i*2.39996,r=.12+.36*Math.sqrt((i+1)/(items.length+1)),base={id:x.id,x:.5+Math.cos(angle)*r,y:.5+Math.sin(angle)*r*(.85+((h%13)/80)),radius:7+(h%7),color:kindOf(x.kind)==='灵感'?'#d27c68':kindOf(x.kind)==='学习内化'?'#9a8ec7':'#84a98c',label:shorten((x.text||'（附件）').replace(/\n/g,' '),22),demo:!!x.demo,updatedAt:x.updatedAt||x.createdAt};return old.has(x.id)?{...base,x:old.get(x.id).x,y:old.get(x.id).y}:base});edges=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=items[i],b=items[j],common=(a.tags||[]).filter(t=>(b.tags||[]).includes(t)).length,linked=b.parentId===a.id||a.parentId===b.id;if(common||linked)edges.push({a:i,b:j,weight:linked?3:common})}edges.sort((a,b)=>b.weight-a.weight);
const recent=items.slice().sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt)).slice(0,4);
$('#graphCurrent').innerHTML=recent.length?`<span class="graph-current-label">最近更新</span>${recent.map(x=>`<button type="button" class="graph-current-chip" data-open="${escapeHTML(x.id)}" title="${escapeHTML(x.text||'附件记录')}">${x.demo?'示例 · ':''}${escapeHTML(shorten(x.text||'（附件记录）',23))}</button>`).join('')}`:'';
}
function resizeGraph(){const rect=canvas.getBoundingClientRect();if(!rect.width)return;graphW=rect.width;graphH=rect.height;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(graphW*dpr);canvas.height=Math.round(graphH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function renderGraph(){
 if(view!=='graph')return;
 ctx.clearRect(0,0,graphW,graphH);
 const dark=document.body.classList.contains('dark'),color=dark?'#f1f1e9':'#3c493f';
 ctx.save();ctx.fillStyle=dark?'#ffffff09':'#a6b4a921';
 for(let x=15;x<graphW;x+=25)for(let y=15;y<graphH;y+=25){ctx.beginPath();ctx.arc(x,y,1,0,7);ctx.fill()}
 if(!nodes.length){ctx.font='14px sans-serif';ctx.fillStyle=dark?'#aaa':'#888';ctx.textAlign='center';ctx.fillText('记录一些想法，这里就会逐渐亮起来。',graphW/2,graphH/2);ctx.restore();return}
 const xy=n=>({x:graphW*(.5+(n.x-.5)*graphScale),y:graphH*(.5+(n.y-.5)*graphScale)});
 for(const edge of edges){const a=xy(nodes[edge.a]),b=xy(nodes[edge.b]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=dark?`rgba(159,180,166,${Math.min(.5,edge.weight*.13)})`:`rgba(142,157,143,${Math.min(.42,edge.weight*.12)})`;ctx.lineWidth=edge.weight>2?1.6:.9;ctx.stroke()}
 for(const n of nodes){const p=xy(n),hover=graphHover===n.id,active=graphDragged===n.id;const radius=(n.radius+(hover||active?3:0))*Math.min(graphScale,1.6);ctx.beginPath();ctx.arc(p.x,p.y,radius*2.3,0,Math.PI*2);ctx.fillStyle=n.color+(hover?'35':'12');ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fillStyle=n.color;ctx.globalAlpha=n.demo?.6:1;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=dark?'#232923':'#fffefa';ctx.lineWidth=2;ctx.stroke()}
 // Labels are excerpts of the actual saved records; avoid overlap while keeping all nodes visible.
 const placed=[];
 const ordered=nodes.map(n=>({n,p:xy(n)})).sort((a,b)=>Number(b.n.id===graphHover)-Number(a.n.id===graphHover)||Number(a.n.demo)-Number(b.n.demo)||new Date(b.n.updatedAt)-new Date(a.n.updatedAt));
 for(let i=0;i<ordered.length;i++){
  const {n,p}=ordered[i];if(i>=65&&n.id!==graphHover)continue;
  const hover=n.id===graphHover,radius=(n.radius+(hover?3:0))*Math.min(graphScale,1.6);
  ctx.font=`${hover?'650':'530'} 12px -apple-system, sans-serif`;
  const maxW=Math.min(220,graphW*.38),w=Math.min(maxW,ctx.measureText(n.label).width);
  const x=Math.max(w/2+5,Math.min(graphW-w/2-5,p.x));
  const y=Math.max(17,Math.min(graphH-9,p.y+radius+18));
  const rect={left:x-w/2-5,right:x+w/2+5,top:y-15,bottom:y+5};
  if(!hover&&placed.some(q=>rect.left<q.right&&rect.right>q.left&&rect.top<q.bottom&&rect.bottom>q.top))continue;
  placed.push(rect);ctx.textAlign='center';ctx.fillStyle=color;ctx.globalAlpha=n.demo?.72:1;ctx.fillText(n.label,x,y,maxW);ctx.globalAlpha=1;
 }
 ctx.restore();
}
function nodeAt(e){const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;for(let i=nodes.length-1;i>=0;i--){const n=nodes[i],px=graphW*(.5+(n.x-.5)*graphScale),py=graphH*(.5+(n.y-.5)*graphScale);if(Math.hypot(x-px,y-py)<Math.max(20,n.radius*graphScale+7))return n}return null}
canvas.addEventListener('pointerdown',e=>{const n=nodeAt(e);graphPointerStart={x:e.clientX,y:e.clientY,n:n?.id};if(n){graphDragged=n.id;canvas.setPointerCapture(e.pointerId)}renderGraph()});canvas.addEventListener('pointermove',e=>{const n=nodeAt(e);graphHover=n?.id||null;canvas.style.cursor=graphDragged?'grabbing':n?'pointer':'grab';if(graphDragged){const target=nodes.find(x=>x.id===graphDragged),rect=canvas.getBoundingClientRect();if(target){target.x=Math.max(.04,Math.min(.96,.5+((e.clientX-rect.left)/graphW-.5)/graphScale));target.y=Math.max(.06,Math.min(.94,.5+((e.clientY-rect.top)/graphH-.5)/graphScale))}}renderGraph()});canvas.addEventListener('pointerup',e=>{if(graphDragged&&graphPointerStart&&Math.hypot(e.clientX-graphPointerStart.x,e.clientY-graphPointerStart.y)<7)openDrawer(graphDragged);graphDragged=null;graphPointerStart=null;renderGraph()});canvas.addEventListener('pointercancel',()=>{graphDragged=null;graphPointerStart=null});canvas.addEventListener('dblclick',e=>{if(!nodeAt(e))randomIdea()});window.addEventListener('resize',()=>{if(view==='graph'){resizeGraph();renderGraph()}});
// Global interactions
const actions={
 'heat-prev':()=>{heatWindow++;selectedDate=null;renderTimeline()},'heat-next':()=>{heatWindow=Math.max(0,heatWindow-1);selectedDate=null;renderTimeline()},'heat-today':()=>jumpToDate(dayKey(new Date())),'clear-day':()=>{selectedDate=null;period='all';renderTimeline()},search:searchModal,theme:()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');storage.setItem(THEME,dark?'dark':'light');$('#themeIcon use').setAttribute('href',dark?'#i-sun':'#i-moon');renderGraph()},settings:settingsModal,help:helpModal,
 save:saveDraft,image:()=>$('#imagePicker').click(),voice:()=>recording?stopRecording():startRecording(),'show-link':()=>{$('#linkEntry').classList.toggle('hidden');$('#linkInput').focus()},'close-link':()=>$('#linkEntry').classList.add('hidden'),'add-link':addLink,'focus-compose':()=>{closeDrawer();closeModal();showView('home');$('#ideaInput').scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>$('#ideaInput').focus(),250)},'timeline-link':()=>showView('timeline'),random:randomIdea,'show-favs':()=>{homeFilter='收藏';showView('home');renderHome();setTimeout(()=>$('#homeCards').scrollIntoView({behavior:'smooth',block:'center'}),150)},'close-drawer':closeDrawer,'favorite-detail':()=>toggleFav(currentId),edit:editIdea,branch:branchIdea,'show-related':()=>$('#relatedSection')?.scrollIntoView({behavior:'smooth',block:'start'}),'prompt-discuss':()=>$('#aiSection')?.scrollIntoView({behavior:'smooth',block:'start'}),delete:removeIdea,'close-modal':closeModal,
 'edit-save':()=>{const x=ideas.find(a=>a.id===currentId);if(!x)return;x.text=$('#editText').value.trim();x.updatedAt=new Date().toISOString();x.tags=inferTags(x.text);x.demo=false;persist();closeModal();renderAll();renderDrawer();toast('已保存修改')},
 'branch-save':()=>{const text=$('#branchText').value.trim();if(!text){toast('先写下延伸的想法');return}const parent=currentId,newIdea=saveNewIdea(text,'灵感',parent);closeModal();openDrawer(newIdea.id);toast('新想法已建立，并与原想法关联')},
 'ai-send':sendAi,'save-discussion':saveDiscussion,export:exportData,import:()=>$('#importPicker').click(),'restore-demo':()=>{if(ideas.length){toast('当前已有记录；请先清空，才能恢复示例');return}ideas=structuredClone(demo);persist();renderAll();closeModal();toast('示例想法已恢复')},'clear-all':clearAll,
 'zoom-in':()=>{graphScale=Math.min(2.4,graphScale*1.2);renderGraph()},'zoom-out':()=>{graphScale=Math.max(.65,graphScale/1.2);renderGraph()},'zoom-reset':()=>{graphScale=1;rebuildGraph();renderGraph()}
};
document.addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){e.preventDefault();e.stopPropagation();toggleFav(fav.dataset.fav);return}const rm=e.target.closest('[data-remove-attach]');if(rm){const i=Number(rm.dataset.removeAttach),a=draftAttachments[i];if(a?.preview)URL.revokeObjectURL(a.preview);draftAttachments.splice(i,1);renderDraftAttachments();return}const v=e.target.closest('[data-view]');if(v){showView(v.dataset.view);return}const filter=e.target.closest('[data-filter]');if(filter){homeFilter=filter.dataset.filter;renderHome();return}const per=e.target.closest('[data-period]');if(per){selectedDate=null;period=per.dataset.period;renderTimeline();return}const day=e.target.closest('[data-day]');if(day){jumpToDate(day.dataset.day);return}const t=e.target.closest('[data-topic]');if(t){graphFilter=t.dataset.topic;$$('#graphFilters .filter').forEach(b=>b.classList.toggle('active',b.dataset.topic===graphFilter));rebuildGraph();renderGraph();return}const side=e.target.closest('[data-home-kind]');if(side){homeFilter=side.dataset.homeKind;showView('home');renderHome();$('#homeCards').scrollIntoView({behavior:'smooth',block:'start'});return}const ai=e.target.closest('[data-ai-mode]');if(ai){simulateGuide(ai.dataset.aiMode);return}const kindOpt=e.target.closest('[data-kind-option]');if(kindOpt){draftKind=kindOf(kindOpt.dataset.kindOption);updateKind();return}const action=e.target.closest('[data-action]');if(action){e.preventDefault();actions[action.dataset.action]?.();return}const open=e.target.closest('[data-open]');if(open)openDrawer(open.dataset.open)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]')){e.preventDefault();openDrawer(e.target.dataset.open)}});
$('#jumpDate').addEventListener('change',e=>{if(e.target.value)jumpToDate(e.target.value)});$('#overlay').addEventListener('click',closeDrawer);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});$('#modalContent').addEventListener('input',e=>{if(e.target.id==='searchInput')renderSearch(e.target.value.trim())});$('#imagePicker').addEventListener('change',e=>{addImageFiles(e.target.files);e.target.value=''});$('#importPicker').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await importData(f);e.target.value=''});
$('#composer').addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();$('#composer').style.borderColor='var(--accent)'}});$('#composer').addEventListener('dragleave',()=>$('#composer').style.borderColor='');$('#composer').addEventListener('drop',e=>{e.preventDefault();$('#composer').style.borderColor='';addImageFiles(e.dataTransfer.files)});
document.addEventListener('paste',e=>{if(document.activeElement===$('#ideaInput')&&e.clipboardData?.files?.length){const f=Array.from(e.clipboardData.files).filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addImageFiles(f)}}});
document.addEventListener('keydown',e=>{const typing=/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable;if(e.key==='Escape'){if($('#modalBackdrop').classList.contains('open'))closeModal();else if($('#drawer').classList.contains('open'))closeDrawer();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();return}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(document.activeElement?.id==='aiInput')sendAi();else if(document.activeElement?.id==='ideaInput')saveDraft();return}if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==='n'&&!$('#modalBackdrop').classList.contains('open')){e.preventDefault();actions['focus-compose']()}});
const weekday=new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(new Date()).toUpperCase();const mm=new Intl.DateTimeFormat('en-US',{month:'short'}).format(new Date()).toUpperCase();$('#dateGreeting').textContent=`${weekday} · ${mm} ${String(new Date().getDate()).padStart(2,'0')}`;
window.addEventListener('storage',event=>{
 if(event.key!==KEY||!event.newValue)return;
 try{
  const incoming=JSON.parse(event.newValue);
  if(!Array.isArray(incoming))return;
  ideas=incoming;
  renderAll();
  if(currentId){if(ideas.some(x=>x.id===currentId))renderDrawer();else closeDrawer()}
 }catch{}
});
if(storage.getItem(THEME)==='dark'){document.body.classList.add('dark');$('#themeIcon use').setAttribute('href','#i-sun')}
updateKind();renderAll();rebuildGraph();
})();
</script>
